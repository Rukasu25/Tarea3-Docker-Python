version: '3.8'
services:
  mongo1:
    image: mongo:7.0.45
    container_name: mongo1
    command: mongod --replSet rs0 --bind_ip_all --port 30001
    ports:
      - "30001:30001"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7.0.45
    container_name: mongo2
    command: mongod --replSet rs0 --bind_ip_all --port 30002
    ports:
      - "30002:30002"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7.0.45
    container_name: mongo3
    command: mongod --replSet rs0 --bind_ip_all --port 30003
    ports:
      - "30003:30003"
    volumes:
      - mongo3_data:/data/db

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: