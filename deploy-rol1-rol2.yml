version: '3.8'

services:
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: ["--replSet", "my-replica-set", "--bind_ip_all"]
    ports:
      - "30001:27017"
    restart: always

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: ["--replSet", "my-replica-set", "--bind_ip_all"]
    ports:
      - "30002:27017"
    restart: always

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: ["--replSet", "my-replica-set", "--bind_ip_all"]
    ports:
      - "30003:27017"
    restart: always